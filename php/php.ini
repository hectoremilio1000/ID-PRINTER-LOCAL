; Copia de php.ini con extensiones habilitadas para sqlite e intl
; Basado en php.ini-production

; ...existing code...

[PHP]
extension_dir = "ext"


; Habilitar SQLite
extension=sqlite3
extension=pdo_sqlite
extension=gd
; Habilitar soporte SQLite en DBA (opcional, solo si tu app lo requiere)
extension=dba
; Handler para dba con sqlite3 (opcional)
;dba.default_handler=sqlite3

; Habilitar intl
extension=intl
extension=openssl

; E-16: opcache también en el servidor integrado (php -S). Sin esto PHP vuelve a
; compilar el controlador de 3,700 líneas y todo el vendor en CADA petición.
; (PHP_CLI_SERVER_WORKERS no existe en Windows, así que no hay varios procesos.)
zend_extension=php_opcache.dll
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=4000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
[PHP]

; Las rutas de CA se inyectan en runtime desde iniciar_servidor.vbs con -d
